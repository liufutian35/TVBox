name: Build TVBox APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 重点：安装Android SDK + NDK，这个是pyramid模块必须的
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build arm64GenericRelease
        run: ./gradlew assembleArm64GenericRelease --stacktrace

      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-arm64-APK
          path: app/build/outputs/apk/arm64Generic/release/*.apk
