name: Build TVBox APK
on:
  workflow_dispatch: # 网页手动触发
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 关键修复：给gradlew添加执行权限，解决126报错
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 升级到v5，消除弃用警告
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build arm64GenericRelease（电视盒子主流版本）
        run: ./gradlew assembleArm64GenericRelease

      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-arm64-APK
          path: app/build/outputs/apk/arm64Generic/release/*.apk
