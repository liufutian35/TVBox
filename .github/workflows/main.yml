name: Build TVBox APK
on:
  workflow_dispatch: # 支持网页手动点按钮编译
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build arm64版本（电视盒子主流）
        run: ./gradlew assembleArm64GenericRelease
      - name: 上传编译好的APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-arm64-APK
          path: app/build/outputs/apk/arm64Generic/release/*.apk
