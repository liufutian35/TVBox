name: Build TVBox APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 新增：修改build.gradle，修复JVM版本冲突 ==========
      - name: Fix kotlin jvmTarget
        run: |
          sed -i '/android {/a \
              kotlinOptions { \
                  jvmTarget = "1.8" \
              }' app/build.gradle

      # ========== 新增：替换为阿里云maven镜像，解决国外源超时 ==========
      - name: Replace maven repo to aliyun
        run: |
          sed -i 's|mavenCentral()|maven { url "https://maven.aliyun.com/repository/public" }|g' settings.gradle

      - name: Build arm64GenericRelease
        run: ./gradlew assembleArm64GenericRelease --stacktrace

      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-arm64-APK
          path: app/build/outputs/apk/arm64Generic/release/*.apk
